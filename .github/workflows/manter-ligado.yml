# Mantém os projetos do Supabase acordados: no plano gratuito, um projeto
# pausa depois de 7 dias sem uso. Roda na nuvem do GitHub, então funciona com
# o computador desligado. Só LER o banco não bastou (o Celula3D pausou em
# 12/10/2026 mesmo assim), então agora a tarefa GRAVA, duas vezes por dia,
# pela função registrar_ping (banco/06-manter-ligado.sql).
name: Manter Supabase ligado

on:
  schedule:
    - cron: "17 11,23 * * *"   # 08:17 e 20:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Célula 3D Lojas
        run: |
          curl -sS -f --retry 3 --retry-delay 30 -X POST "https://zxrckfodzdoaoelgkbsb.supabase.co/rest/v1/rpc/registrar_ping" \
            -H "apikey: sb_publishable_mCzdGc-Qg8zlG1pi3hq-2A_iUVDhBbN" \
            -H "Content-Type: application/json" -d '{}'
      - name: Marcenaria (Bancada)
        if: always()
        run: |
          curl -sS -f --retry 3 --retry-delay 30 -X POST "https://ttsvokeclvuendqkpwlc.supabase.co/rest/v1/rpc/registrar_ping" \
            -H "apikey: sb_publishable_bjAojihh-Y5vU_j_uaFJ3g_G5LTdp0Z" \
            -H "Content-Type: application/json" -d '{}'

      # O GitHub desliga tarefas agendadas de repositórios parados há 60 dias.
      # Uma vez por mês esta tarefa grava a data, e o repositório nunca fica parado.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Registro mensal
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" -lt 12 ]; then
            date -u +%Y-%m-%d > .ultimo-ping
            git config user.name "manter-ligado"
            git config user.email "actions@users.noreply.github.com"
            git add .ultimo-ping && git commit -m "Registro mensal do manter-ligado" && git push
          fi
